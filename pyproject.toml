[project]
name = "neighbourhoodwatt"
version = "0.1.0"
description = "Desktop simulation and optimisation of shared community solar and batteries"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [
    { name = "Alexander Mewis" },
    { name = "Conor Kikkert" },
    { name = "Hugh Torpie" },
    { name = "Jonathan Smith" },
    { name = "Kyle Schwegmann" },
    { name = "Robbie Crouch" },
]
requires-python = ">=3.12"

[project.scripts]
gridsync = "team_21_the_grid_optimists.cli:entry_point"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/team_21_the_grid_optimists",
    "src/backend_v2",
    "src/database_v2",
    "src/frontend_v2",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "nemosis",
    "nemosis.*",
    "pvlib.*",
    "pyomo",
    "pyomo.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# E/W = Pycodestyle, F = Pyflakes, I = Isort, UP = Pyupgrade, B = Bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/backend_v2 --cov=src/database_v2 --cov-report=term-missing --cov-fail-under=80"

[tool.ruff.lint.isort]
known-first-party = ["backend_v2", "database_v2", "frontend_v2"]

[[tool.mypy.overrides]]
module = [
    "backend.optimiser.rolling_optimiser_example_data",
    "backend.optimiser.rolling_optimiser_plotting",
]
ignore_errors = true
